services:
  db:
    image: postgres:16-alpine
    container_name: investops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investops}
      POSTGRES_USER: ${POSTGRES_USER:-investops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investops_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-investops_user} -d $${POSTGRES_DB:-investops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
